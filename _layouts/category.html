---
layout: main
---
<h1 class="category-title">{{ page.title }}</h1>
{% assign cat_posts = site.categories[page.category] %}
{% if cat_posts and cat_posts.size > 0 %}
  {% for post in cat_posts %}
    {% include post-card.html post=post %}
  {% endfor %}
{% else %}
  <p class="category-empty">아직 작성된 글이 없습니다.</p>
{% endif %}
